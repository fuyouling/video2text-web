services:
  api:
    build: .
    image: video2text-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./.env
    environment:
      - APP_ENV=production
      - DB_URL=sqlite:////data/app.db
    volumes:
      - ./data:/data
      - ./.env:/app/.env:ro
    # e2-micro = 1 GB RAM. Cap the container so it can't OOM-kill the host.
    deploy:
      resources:
        limits:
          memory: 512M
    # Run migrations then start; if migrate fails the container won't come up.
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000",
      ]
