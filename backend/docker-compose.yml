services:
  api:
    build: .
    image: video2text-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../.env
    environment:
      - DB_URL=sqlite:////data/app.db
    volumes:
      - ./data:/data
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"]
