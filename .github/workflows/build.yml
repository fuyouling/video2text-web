name: "Frontend Build & Deploy"

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - run: npm ci

      - run: npm run check

      - run: npm run build

  deploy-cf:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE: ${{ vars.PUBLIC_SITE }}
      PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
      PUBLIC_RELEASE_REPO: ${{ vars.PUBLIC_RELEASE_REPO }}
      PUBLIC_GITHUB_API: ${{ vars.PUBLIC_GITHUB_API }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - uses: cloudflare/pages-action@v2
        with:
          project-name: "video2text-web"
          project-directory: "dist"
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment
          path: dist
