name: "Frontend Build & Deploy"

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: "npm"

      - run: npm ci

      - run: npm run check

      - run: npm run build

  deploy-cf:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE: ${{ vars.PUBLIC_SITE }}
      PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
      PUBLIC_RELEASE_REPO: ${{ vars.PUBLIC_RELEASE_REPO }}
      PUBLIC_GITHUB_API: ${{ vars.PUBLIC_GITHUB_API }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        # 固定到 v3 稳定版：最新 v4 的 miniflare canary 依赖已被撤销，会导致安装失败。
        run: npx wrangler@3.114.17 pages deploy dist --project-name=video2text-web --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show wrangler logs on failure
        if: failure()
        run: |
          LOG_DIR="$HOME/.config/.wrangler/logs"
          if [ -d "$LOG_DIR" ]; then
            echo "=== Wrangler log files ==="
            ls -la "$LOG_DIR"
            echo "=== Latest log content ==="
            LATEST=$(ls -t "$LOG_DIR"/*.log 2>/dev/null | head -1)
            if [ -n "$LATEST" ]; then
              cat "$LATEST"
            fi
          fi

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment
          path: dist
